################################################################################
# SWITCHES — enable and always-on
################################################################################
switch:
  - platform: template
    name: "Transmisja modbus"
    id: sw_modbus_polling
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - component.resume:
          id: hpi4
    turn_off_action:
      - component.suspend:
          id: hpi4
    internal: true
  
  # Enable switch
  - platform: modbus_controller
    modbus_controller_id: hpi4
    id: sw_enable
    name: "Aktywacja (zezwolenie na pracę)"
    icon: "mdi:power"
    restore_mode: RESTORE_DEFAULT_OFF
    register_type: holding
    address: 186
    bitmask: 0x0100 # bit8
    use_write_multiple: true

  # Switch "always enabled"
  - platform: template
    id: sw_always_enabled
    name: "Zawsze aktywna (auto aktywacja)"
    icon: "mdi:autorenew"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(always_on_mode);
    turn_on_action:
      - globals.set:
          id: always_on_mode
          value: 'true'
      - switch.turn_on: sw_enable
    turn_off_action:
      - globals.set:
          id: always_on_mode
          value: 'false'

################################################################################
# NUMBERS — setpoint editing with range and step 1
################################################################################
number:
  # N01 — desired CWU tank temperature (20–55°C, step 1°C)
  - platform: modbus_controller
    modbus_controller_id: hpi4
    id: num_n01
    name: "N01 Nastawa temperatury CWU"
    icon: "mdi:thermometer-water"
    register_type: holding
    address: 202
    value_type: U_WORD_S
    min_value: 20
    max_value: 55
    step: 1
    mode: box
    use_write_multiple: true
    unit_of_measurement: "°C"
    multiply: 10

  # N02 — minimum air temperature (5–15°C, step 1°C)
  - platform: modbus_controller
    modbus_controller_id: hpi4
    id: num_n02
    name: "N02 Nastawa minimalnej temperatury powietrza"
    icon: "mdi:thermometer-minus"
    register_type: holding
    address: 203
    value_type: U_WORD_S
    min_value: 5
    max_value: 15
    step: 1
    mode: box
    use_write_multiple: true
    unit_of_measurement: "°C"
    multiply: 10

  # reg 204 — unknown (same value as r202)
  - platform: modbus_controller
    modbus_controller_id: hpi4
    id: r204
    name: "r204 (kopia N01?)"
    register_type: holding
    address: 204
    value_type: U_WORD_S
    min_value: 20
    max_value: 55
    step: 1
    mode: box
    use_write_multiple: true
    unit_of_measurement: "°C"
    internal: true
    multiply: 10
